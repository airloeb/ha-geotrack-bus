# School Bus dashboard — real entity ids, confirmed live 2026-09-04.
#
# To use: Settings -> Dashboards -> + Add Dashboard -> New dashboard from scratch
# ("School Bus", icon mdi:bus-school). Open it, then top-right pencil -> ⋮ ->
# "Raw configuration editor", and paste everything below.
#
# Bus 351 (route BEMTR31A) serves your stop 1.
# Bus 259 (route OBYHS1A)  serves your stop 3.
#
# ETA is learned by timing how long before arrival the bus was at each distance
# from your stop, anchored on the portal's own "was by your stop at ..." time.
# It reads unknown until a route has been watched through one complete run, and
# "Runs measured" shows how much has been banked. Outside school hours every
# card reads unavailable — that is normal.

views:
  - title: School Bus
    path: buses
    icon: mdi:bus-school
    cards:
      - type: markdown
        content: >-
          Buses report only while on a run. Outside school hours these cards
          read *unavailable*.


          **ETA** is learned from past runs — it is unknown until one completes.
          Check *Runs measured* to see how much it has to go on, and the
          `warning_at_miles` attribute for how far out the alert will fire.

      - type: vertical-stack
        cards:
          - type: map
            entities:
              - device_tracker.bus_351
            hours_to_show: 2
            theme_mode: auto
          - type: entities
            title: Bus 351 — Stop 1 (route BEMTR31A)
            entities:
              - entity: sensor.bus_351_stop_1_eta
                name: ETA
              - entity: binary_sensor.bus_351_stop_1_arriving_soon
                name: Arriving soon
              - entity: sensor.bus_351_stop_1_status
                name: Status
              - entity: sensor.bus_351_stop_1_distance
                name: Distance to stop
              - entity: sensor.bus_351_stop_1_runs_measured
                name: Runs measured
              - type: divider
              - entity: sensor.bus_351_speed
                name: Speed
              - entity: sensor.bus_351_current_address
                name: Now near
              - entity: sensor.bus_351_last_report
                name: Last report
              - entity: binary_sensor.bus_351_stop_1_already_passed
                name: Already passed

      - type: vertical-stack
        cards:
          - type: map
            entities:
              - device_tracker.bus_259
            hours_to_show: 2
            theme_mode: auto
          - type: entities
            title: Bus 259 — Stop 3 (route OBYHS1A)
            entities:
              - entity: sensor.bus_259_stop_3_eta
                name: ETA
              - entity: binary_sensor.bus_259_stop_3_arriving_soon
                name: Arriving soon
              - entity: sensor.bus_259_stop_3_status
                name: Status
              - entity: sensor.bus_259_stop_3_stops_away
                name: Stops away
              - entity: sensor.bus_259_stop_3_distance
                name: Distance to stop
              - entity: sensor.bus_259_stop_3_runs_measured
                name: Runs measured
              - type: divider
              - entity: sensor.bus_259_speed
                name: Speed
              - entity: sensor.bus_259_current_address
                name: Now near
              - entity: sensor.bus_259_last_report
                name: Last report
              - entity: binary_sensor.bus_259_stop_3_already_passed
                name: Already passed
